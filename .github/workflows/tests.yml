name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 测试刻意不依赖 paddleocr / PyMuPDF / GPU：它们用假模块换掉 sys.modules，
      # 所以要装的真实依赖只有 numpy。PyMuPDF 是用来跑那组"真 API 集成用例"的
      # （真渲染、真画矩形）；不装也能跑，那组会自动跳过。
      - run: python -m pip install --upgrade pip numpy pymupdf
      - run: python -m unittest discover -v
